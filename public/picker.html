<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/explore/leaflet.css"><style>body{margin:0}#map{height:100vh}.hint{position:absolute;z-index:999;top:12px;left:50px;background:white;padding:9px 12px;border-radius:5px;font:12px sans-serif;box-shadow:0 2px 8px #0002}</style></head><body><div id="map"></div><div class="hint">Click the map to pin the location</div><script src="/explore/leaflet.js"></script><script>const map=L.map('map').setView([40.73,-73.94],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);let pin;map.on('click',e=>{if(pin)map.removeLayer(pin);pin=L.circleMarker(e.latlng,{radius:10,color:'#256958',fillOpacity:.8}).addTo(map);parent.postMessage({type:'city-pulse-location',latitude:e.latlng.lat,longitude:e.latlng.lng},location.origin)});</script></body></html>
